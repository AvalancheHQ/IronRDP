[package]
name = "ironrdp-bench"
version = "0.0.0"
description = "IronRDP benchmarks"
edition.workspace = true
publish = false

[dev-dependencies]
criterion = { version = "5.0.1", package = "codspeed-criterion-compat" }
ironrdp-core = { path = "../ironrdp-core", features = ["alloc"] }
ironrdp-graphics.path = "../ironrdp-graphics"
ironrdp-pdu.path = "../ironrdp-pdu"
ironrdp-server = { path = "../ironrdp-server", features = ["__bench"] }

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[lints]
workspace = true
